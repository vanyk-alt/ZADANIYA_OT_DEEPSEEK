<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ task.title }}</title>
</head>
<body>
    <h1>{{ task.title }} </h1>

    <p><strong>Статус:</strong>
        {% if task.done %}✅ Выполнено{% else %}❌ Не выполнено{% endif %}
    </p>
    
    <p><strong>Создана:</strong> {{ task.created_at }}</p>

    <h2>Описание</h2>

    {% if task.description %}
        <p>{{ task.description }}</p>
        <a href="#">[Редактировать описание]</a>
    {% else %}
        <p><em>Описание пока не добавлено.</em></p>
        <form method="POST">
            {% csrf_token %}
            <textarea name="description" rows="4" cols="50" placeholder="Введите описание задачи..."></textarea>
            <br>
            <button type="submit">Сохранить описание </button>
        </form>
    {%endif%}


    <hr>
    <a href="{%url 'task_list' %}">← Назад к списку</a>
</body>
</html>

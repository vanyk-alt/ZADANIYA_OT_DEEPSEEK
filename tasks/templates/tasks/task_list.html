<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Список задач</h1>
    <form method ="POST">
        {% csrf_token %}
        <div>
            <input type="text" name="title" placeholder="Введите новую задачу" required>
        </div>

        <div>
            <textarea name="description" placeholder="Описание" rows="3" style="width: 300px"></textarea>
        </div>

        <div>
            <button type="submit">Добавить</button>
        </div>
    </form>
    <ul>
        {% for task in tasks %}
            <li>
                <a href="{%url 'task_detail' task.id %}">{{task.title}}</a> -
                {% if task.done %} ✅ Выполнено {% else %} ❌ Не выполнено {% endif %}
                {% if task.done %}
                    <a href="{% url 'toggle_task' task.id %}">[Ещё не выполнена]</a>
                {% else %}
                    <a href="{% url 'toggle_task' task.id %}">[Выполнить]</a>
                {%endif%}
                <a href="{% url 'delete_task_confirm' task.id %}">[Удалить]</a>
            </li>
        {%endfor%}
    </ul>

</body>
</html>
